name: Build DEB Package
on: [push]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ldid
        run: brew install ldid

      - name: Install Theos & Patched SDKs
        run: |
          git clone --recursive https://github.com/theos/theos.git ~/theos
          curl -LO https://github.com/theos/sdks/releases/download/v3.0/iPhoneOS10.3.sdk.tar.xz
          mkdir -p ~/theos/sdks
          tar -xf iPhoneOS10.3.sdk.tar.xz -C ~/theos/sdks/
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Build Package
        run: |
          make package FINALPACKAGE=1 SYSROOT=$THEOS/sdks/iPhoneOS10.3.sdk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YTMPlayer-deb
          path: packages/*.deb
